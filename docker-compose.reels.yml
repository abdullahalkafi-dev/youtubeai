# Isolated reel-generation stack.
#
# Separate compose PROJECT ("youtubeai-reels"): the main deploy (deploy.sh / docker-compose.prod.yml)
# never rebuilds, restarts or removes these containers, and these never touch the main app's containers.
# It only joins the existing network to reach mongodb / redis / minio.
#
#   Deploy / update:  docker compose -f docker-compose.reels.yml up -d --build
#   Logs:             docker compose -f docker-compose.reels.yml logs -f --tail=200 reel-worker
#   Kill switch:      set REELS_ENABLED=false in youtube-reel-service/.env.prod, then `up -d` again
#   Stop entirely:    docker compose -f docker-compose.reels.yml down        (keeps all data)
name: youtubeai-reels

services:
  reel-api:
    build: ./youtube-reel-service
    image: youtubeai-reels:latest
    command: ['node', 'dist/main.api.js']
    env_file:
      - ./youtube-reel-service/.env.prod
    ports:
      - '127.0.0.1:5002:5002'
    # Receives raw video uploads (written straight to the shared work volume).
    volumes:
      - reel_work:/work
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 256
    restart: always
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5002/api/reels/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - youtubeai

  reel-worker:
    # Same image as reel-api (built once by reel-api; never pulled from a registry).
    image: youtubeai-reels:latest
    pull_policy: never
    depends_on:
      - reel-api
    command: ['node', 'dist/main.worker.js']
    env_file:
      - ./youtube-reel-service/.env.prod
    volumes:
      - reel_work:/work
    # Hard budget so rendering can never starve the main app (box: 4 vCPU / 16 GB). Two renders run in parallel (one ffmpeg can peak at ~2.2 GB, so 4g was not enough and got renders OOM-killed);
    # every ffmpeg runs under `nice`, so the main app still wins the CPU whenever it needs it.
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 3.0
    pids_limit: 512
    stop_grace_period: 30s
    restart: always
    networks:
      - youtubeai

networks:
  youtubeai:
    external: true
    name: youtubeai_default

volumes:
  reel_work:
