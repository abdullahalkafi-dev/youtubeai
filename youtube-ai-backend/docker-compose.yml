services:
  app:
    build:
      context: .
      target: base
    ports:
      - '5001:5001'
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/youtube_ai
      - REDIS_URL=redis://redis:6379
      - CHROMADB_URL=http://chromadb:8000
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: pnpm run start:dev

  mongodb:
    image: mongo:7
    ports:
      - '27019:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - '8000:8000'
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/8000" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6399:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    ports:
      - '9005:9000'
      - '9006:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  mongo_data:
  chroma_data:
  redis_data:
  minio_data:
  ollama_data:
  node_modules:
