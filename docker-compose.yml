services:
  frontend:
    build:
      context: ./youtube-ai-frontend
      target: dev
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5001/api
      - PORT=3000
    volumes:
      - ./youtube-ai-frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./youtube-ai-frontend/.next:/app/.next
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./youtube-ai-backend
      target: base
    ports:
      - '5001:5001'
    env_file:
      - ./youtube-ai-backend/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/youtube_ai
      - REDIS_URL=redis://redis:6379
      - CHROMADB_URL=http://chromadb:8000
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - OLLAMA_URL=http://ollama:11434
      - PORT=5001
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./youtube-ai-backend:/app
      - backend_node_modules:/app/node_modules
    command: pnpm run start:dev
    restart: unless-stopped

  mongodb:
    image: mongo:7
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval '
          try {
            rs.status().ok
          } catch (e) {
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "mongodb:27017" }]
            }).ok
          }
        '
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - '8000:8000'
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "perl -MIO::Socket::INET -e '$s=IO::Socket::INET->new(\"127.0.0.1:8000\") or exit 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    ports:
      - '11434:11434'
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  mongo_data:
  chroma_data:
  redis_data:
  minio_data:
  ollama_data:
  backend_node_modules:
  frontend_node_modules:
